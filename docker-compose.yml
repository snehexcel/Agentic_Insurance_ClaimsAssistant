services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claims
      POSTGRES_USER: claims_user
      POSTGRES_PASSWORD: local_demo_password_change_me
    ports:
      - "5433:5432"
    volumes:
      - claims_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims_user -d claims"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://claims_user:local_demo_password_change_me@db:5432/claims
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
volumes:
  claims_pgdata:
